<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTrader | Global Trading Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-panel { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-12">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold">📈</div>
      <span class="text-lg font-bold text-white">ApexTrader</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="userBalance" class="text-emerald-400 font-bold text-sm">$250.00</span>
      <button id="authBtn" onclick="toggleAuthModal()" class="px-3 py-1.5 rounded-lg bg-blue-600 font-semibold text-xs">Login</button>
    </div>
  </header>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- Promo Banner -->
    <div id="adBanner" class="rounded-2xl p-4 bg-gradient-to-r from-blue-900 to-indigo-900 border border-slate-800">
      <span class="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] font-bold rounded-full">PROMO</span>
      <h2 id="adTitle" class="text-lg font-bold mt-1 text-white">Get Up To 100% Deposit Bonus</h2>
    </div>

    <!-- Auth Modal / Box -->
    <div id="authBox" class="glass-panel p-4 rounded-2xl border border-slate-800 hidden space-y-3">
      <h3 id="authTitle" class="text-md font-bold text-white">User Login</h3>
      <input type="email" id="authEmail" placeholder="Email Address" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white text-sm">
      <input type="password" id="authPassword" placeholder="Password" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white text-sm">
      <button onclick="handleAuthSubmit()" class="w-full py-2 bg-emerald-500 font-bold text-white rounded-lg text-sm">Submit</button>
      <p class="text-center text-xs text-blue-400 cursor-pointer" onclick="switchAuthMode()">Switch Login/Register</p>
    </div>

    <!-- Interactive Price & Canvas Chart Card -->
    <div class="glass-panel rounded-2xl p-4 border border-slate-800 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h3 id="chartPairTitle" class="text-base font-bold text-white">BTC / USDT</h3>
          <span id="livePriceHeader" class="text-xl font-bold text-emerald-400">$65,000.00</span>
        </div>
        <div class="flex gap-1">
          <button onclick="setPair('BTCUSDT', 65000)" class="px-2 py-1 text-xs rounded bg-slate-800 text-slate-300">BTC</button>
          <button onclick="setPair('ETHUSDT', 3500)" class="px-2 py-1 text-xs rounded bg-slate-800 text-slate-300">ETH</button>
          <button onclick="setPair('SOLUSDT', 145)" class="px-2 py-1 text-xs rounded bg-slate-800 text-slate-300">SOL</button>
        </div>
      </div>
      
      <!-- Custom Smooth Live Canvas Chart -->
      <div class="w-full h-48 bg-slate-900 rounded-xl relative overflow-hidden border border-slate-800">
        <canvas id="priceCanvas" class="w-full h-full"></canvas>
      </div>
    </div>

    <!-- Trading Control Panel -->
    <div class="glass-panel rounded-2xl p-4 border border-slate-800 space-y-3">
      <h3 class="text-md font-bold text-white">Quick Trade</h3>
      
      <div>
        <label class="text-xs text-slate-400">Investment Amount ($)</label>
        <input type="number" id="tradeAmount" value="20" class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white text-sm font-bold">
      </div>

      <div>
        <label class="text-xs text-slate-400">Duration</label>
        <div class="grid grid-cols-3 gap-2 mt-1">
          <button onclick="setDuration(30)" class="py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs font-bold text-blue-400">30s</button>
          <button onclick="setDuration(60)" class="py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs font-bold text-slate-300">60s</button>
          <button onclick="setDuration(120)" class="py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs font-bold text-slate-300">120s</button>
        </div>
        <p class="text-xs text-slate-400 mt-1">Timer: <span id="selectedDurationDisplay" class="text-blue-400 font-bold">30</span>s</p>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="executeTrade('up')" class="py-3 bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-lg">Call (UP)</button>
        <button onclick="executeTrade('down')" class="py-3 bg-rose-500 text-white font-bold rounded-xl text-sm shadow-lg">Put (DOWN)</button>
      </div>

      <div id="animationBox" class="hidden p-3 rounded-xl bg-slate-900 border border-blue-500/40 text-center space-y-1">
        <p class="text-xs text-slate-300">Contract running...</p>
        <p class="text-lg font-extrabold text-amber-400" id="countdown">30s</p>
      </div>
    </div>

    <!-- Wallet & Deposit Section -->
    <div id="walletBox" class="glass-panel rounded-2xl p-4 border border-slate-800 space-y-2 hidden">
      <h3 class="text-sm font-bold text-white">Manual Deposit</h3>
      <input type="number" id="depositAmount" placeholder="Amount to deposit" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white text-xs">
      <button onclick="requestDeposit()" class="w-full py-2 bg-emerald-600 text-white font-bold rounded-lg text-xs">Submit Deposit</button>
    </div>

  </div>

  <script>
    let currentPrice = 65000.00;
    let selectedDuration = 30;
    let userBalance = parseFloat(localStorage.getItem('user_balance') || '250.00');
    let currentUser = localStorage.getItem('current_user') || null;
    let priceHistory = [];

    window.onload = function() {
      if (localStorage.getItem('admin_ad_text')) document.getElementById('adTitle').innerText = localStorage.getItem('admin_ad_text');
      checkSession();
      initCanvasChart();
    };

    function setPair(pair, basePrice) {
      document.getElementById('chartPairTitle').innerText = pair.replace('USDT', ' / USDT');
      currentPrice = basePrice;
    }

    function setDuration(sec) {
      selectedDuration = sec;
      document.getElementById('selectedDurationDisplay').innerText = sec;
    }

    function toggleAuthModal() {
      const box = document.getElementById('authBox');
      box.classList.toggle('hidden');
    }

    let isLogin = true;
    function switchAuthMode() {
      isLogin = !isLogin;
      document.getElementById('authTitle').innerText = isLogin ? 'User Login' : 'User Registration';
    }

    function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value;
      if (!email) return alert('Enter email');
      currentUser = email;
      localStorage.setItem('current_user', currentUser);
      toggleAuthModal();
      checkSession();
      alert('Logged in successfully!');
    }

    function checkSession() {
      if (currentUser) {
        document.getElementById('userBalance').innerText = `$${userBalance.toFixed(2)}`;
        document.getElementById('authBtn').innerText = 'Logout';
        document.getElementById('authBtn').setAttribute('onclick', 'logout()');
        document.getElementById('walletBox').classList.remove('hidden');
      } else {
        document.getElementById('userBalance').innerText = '$250.00';
        document.getElementById('authBtn').innerText = 'Login';
        document.getElementById('authBtn').setAttribute('onclick', 'toggleAuthModal()');
        document.getElementById('walletBox').classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('current_user');
      currentUser = null;
      checkSession();
      alert('Logged out');
    }

    function requestDeposit() {
      const amt = document.getElementById('depositAmount').value;
      if (!amt) return alert('Enter amount');
      alert('Deposit request sent to admin panel!');
    }

    function executeTrade(direction) {
      const amount = parseFloat(document.getElementById('tradeAmount').value);
      if (amount > userBalance) return alert('Insufficient balance!');

      userBalance -= amount;
      updateBal();

      const animBox = document.getElementById('animationBox');
      const countDisplay = document.getElementById('countdown');
      animBox.classList.remove('hidden');
      let timeLeft = selectedDuration;

      const timer = setInterval(() => {
        timeLeft--;
        countDisplay.innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          animBox.classList.add('hidden');

          // Controlled via admin.html outcome mode (WIN or LOSS)
          const mode = localStorage.getItem('admin_outcome_mode') || 'WIN';
          if (mode === 'WIN') {
            const win = amount * 1.85;
            userBalance += win;
            alert(`🎉 Trade Won! +$${win.toFixed(2)}`);
          } else {
            alert(`❌ Trade Lost: -$${amount.toFixed(2)}`);
          }
          updateBal();
        }
      }, 1000);
    }

    function updateBal() {
      localStorage.setItem('user_balance', userBalance);
      document.getElementById('userBalance').innerText = `$${userBalance.toFixed(2)}`;
    }

    // Smooth Canvas Chart Generator
    function initCanvasChart() {
      const canvas = document.getElementById('priceCanvas');
      const ctx = canvas.getContext('2d');
      
      for(let i=0; i<40; i++) {
        currentPrice += (Math.random() - 0.48) * 15;
        priceHistory.push(currentPrice);
      }

      setInterval(() => {
        currentPrice += (Math.random() - 0.48) * 20;
        priceHistory.push(currentPrice);
        if (priceHistory.length > 40) priceHistory.shift();

        document.getElementById('livePriceHeader').innerText = `$${currentPrice.toFixed(2)}`;

        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.beginPath();

        const max = Math.max(...priceHistory);
        const min = Math.min(...priceHistory);
        const range = max - min || 1;

        priceHistory.forEach((p, idx) => {
          const x = (idx / (priceHistory.length - 1)) * canvas.width;
          const y = canvas.height - ((p - min) / range) * (canvas.height - 20) - 10;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }, 1000);
    }
  </script>
</body>
</html>
